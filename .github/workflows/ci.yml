name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend (Lint, Audit, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Production Dependency Security Audit
        run: npm audit --omit=dev

      - name: Build Production Assets
        run: npm run build
        env:
          VITE_API_URL: https://api.routemaster.app
          VITE_DEMO_MODE: 'false'

  backend:
    name: Backend (Tests, Security Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run Security Audit (pip-audit)
        run: pip-audit

      - name: Run Pytest Suite
        run: pytest backend/tests -v
        env:
          ENVIRONMENT: test
          MONGODB_URI: mongodb://localhost:27017/test_db
          MONGODB_DATABASE: pathfinder_test
          JWT_SECRET: super_secret_ci_key_at_least_32_bytes_long_12345
          SEMANTIC_SEARCH_ENABLED: 'false'

