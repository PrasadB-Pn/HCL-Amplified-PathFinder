services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routemaster-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - MONGODB_URI=mongodb://mongo:27017/pathfinder
      - MONGODB_DATABASE=pathfinder
      - JWT_SECRET=change_this_to_a_long_random_secret_in_production_32_bytes
      - JWT_ACCESS_EXPIRE_MINUTES=15
      - JWT_REFRESH_EXPIRE_DAYS=7
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      - SEMANTIC_SEARCH_ENABLED=false
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: routemaster-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:

